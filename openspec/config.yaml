schema: spec-driven

# 创建 proposal / design / tasks 等产物时，会提供给 AI 的项目背景（可选但建议填写）
context: |
  项目：Kuake CLI（github.com/zhangjingwei/kuake_cli）——夸克网盘非官方第三方 CLI/SDK（Go）。
  能力：文件与目录、上传下载、分享与转存、JSON/管道模式、技能集成等。
  许可证：AGPL-3.0；商业使用须另行授权。
  约定：与现有 Go 代码风格一致；CLI 行为见 docs/cli.md；重大行为变更需反映在 OpenSpec 与 docs/CHANGELOG。

# 按产物类型的额外规则（可选）
rules:
  proposal:
    - 说明问题背景、目标与非目标；非官方工具与合规/账号风险如需应简要提及。
  design:
    - 涉及 API/上传/并发时写清错误处理与向后兼容策略。
  tasks:
    - 任务可独立验证、粒度适合单次提交或短分支；需要时注明相关包路径（如 sdk/、cmd/）。
